<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAnimal｜お手入れアイテムの見直し</title>
<style>
:root{color-scheme:light;--green:#364e3c;--paper:#fffdf8;--line:#d8ddcf;--muted:#667060}*{box-sizing:border-box}body{margin:0;background:#f2f2e9;color:#24372b;font:16px/1.65 system-ui,"Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button,.file-button{border:1px solid var(--line);border-radius:9px;padding:9px 15px;background:var(--paper);color:var(--green)}button:hover,.file-button:hover{background:#e7ecdf}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #b88a43;outline-offset:3px}header{padding:25px 4vw 18px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{letter-spacing:.16em;font-size:12px;color:var(--muted)}h1{font-size:26px;margin:4px 0}p{margin:7px 0}.sub{font-size:14px;color:var(--muted)}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:15px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#253d2c}.file-button{display:inline-block}.file-button input{position:absolute;width:1px;height:1px;opacity:0}.file-button:focus-within{outline:3px solid #b88a43}.save{font-size:13px;color:var(--muted);margin:8px 0 0}main{max-width:1450px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:24px 4vw}aside{min-width:0}.filters{display:flex;gap:7px;margin-bottom:10px}select{min-width:0;width:50%;border:1px solid var(--line);border-radius:8px;background:white;padding:9px 6px}#progress{font-size:14px;margin-bottom:10px}progress{width:100%;accent-color:var(--green);height:7px}nav{display:grid;gap:5px}nav button{display:flex;justify-content:space-between;text-align:left;gap:8px;padding:10px;font-size:14px}nav button[aria-current=true]{background:var(--green);color:white;border-color:var(--green)}nav span{white-space:nowrap;font-size:12px;opacity:.8}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:25px;min-width:0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:13px;color:var(--muted)}h2{font-size:25px;margin:5px 0 18px}.content{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1fr);gap:26px}.visual{min-width:0}figure{margin:0}#photo{width:100%;height:auto;aspect-ratio:1;object-fit:contain;background:#f7f4ec;border-radius:12px;display:block}figcaption{font-size:12px;color:var(--muted);margin-top:9px}#placeholder{aspect-ratio:1;display:grid;place-content:center;text-align:center;background:#e8eee5;border-radius:12px;padding:20px;font-size:22px}#placeholder small{font-size:14px;color:var(--muted)}fieldset{padding:0;border:0;margin:0 0 17px}legend,.label{font-weight:650;margin-bottom:8px;display:block}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{display:flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.choice:has(input:checked){background:#e0eadc;border-color:var(--green)}input[type=radio]{accent-color:var(--green);width:18px;height:18px}textarea{display:block;resize:vertical;min-height:105px;width:100%;border:1px solid #bfc8b9;border-radius:9px;padding:11px;background:white;color:#24372b;margin:6px 0 16px}.hint{font-size:12px;font-weight:400;color:var(--muted)}.pager{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}#empty{padding:60px 20px;text-align:center;color:var(--muted)}[hidden]{display:none!important}details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer}#allNotes{min-height:90px}.notice{padding:10px 14px;background:#edf1e6;border-radius:8px;font-size:13px}footer{max-width:1450px;margin:auto;padding:0 4vw 25px;color:var(--muted);font-size:12px}@media(max-width:1050px){main{grid-template-columns:215px 1fr}.content{grid-template-columns:1fr}#photo,#placeholder{max-height:410px}h1{font-size:23px}}@media(max-width:650px){main{display:block;padding:16px}.panel{padding:18px}aside{margin-bottom:16px}nav{max-height:160px;overflow:auto;grid-template-columns:1fr 1fr}nav button{font-size:12px;padding:8px}nav span{font-size:11px}.content{gap:16px}header{padding:20px 16px}.tools button,.file-button{font-size:13px;padding:9px}h2{font-size:22px}}
</style>
<header>
<div class="brand">VAnimal / CARE COLLECTION</div>
<h1>お手入れアイテムの見直し</h1>
<p class="sub">1点ずつ、残すものと直したいところを。既存17品 ＋ プール候補1品。</p>
<div class="tools"><button class="primary" id="export">回答を保存（JSON）</button><button id="markdown">読みやすい一覧を保存</button><label class="file-button">回答を読み込む<input id="import" type="file" accept=".json,application/json"></label></div>
<p class="save" id="saveStatus" role="status" aria-live="polite"></p>
<p class="sub">入力はこのブラウザーに保存します。共有・引き継ぎには「回答を保存」でダウンロードしたJSONを使ってください。</p>
</header>
<main>
<aside><div id="progress"></div><progress id="meter" max="18" value="0" aria-label="採否の記入状況"></progress>
<div class="filters"><select id="category" aria-label="カテゴリ"><option value="all">すべての種類</option><option>泡</option><option>水</option><option>仕上げ</option><option>洗い場</option></select><select id="statusFilter" aria-label="確認状況"><option value="all">すべての状態</option><option value="unreviewed">未確認</option><option value="keep">いる</option><option value="remove">いらない</option><option value="hold">保留</option></select></div><nav id="list" aria-label="アイテム一覧"></nav></aside>
<section class="panel"><div id="empty" hidden>この条件のアイテムはありません。<br>一覧の絞り込みを変更してください。</div><div id="card">
<div class="topline"><span class="tag" id="categoryLabel"></span><span class="tag" id="number"></span></div><h2 id="name"></h2>
<div class="content"><div class="visual"><figure><img id="photo" alt=""><div id="placeholder" hidden>プール<small>未制作・画像なし<br>形や素材の希望を記入してください</small></div><figcaption id="caption"></figcaption></figure></div>
<div><fieldset><legend>このアイテムは必要？</legend><div class="choices"><label class="choice"><input type="radio" name="decision" value="keep">いる</label><label class="choice"><input type="radio" name="decision" value="remove">いらない</label><label class="choice"><input type="radio" name="decision" value="hold">保留</label></div></fieldset>
<label class="label" for="notes">改善したいところ・判断の理由<textarea id="notes" maxlength="12000" placeholder="例：形は残したい。もっと木の質感がほしい。ほかの道具と役割が重なるので不要。"></textarea></label>
<label class="label" for="grip">持ったときの違和感<span class="hint">　道具以外は空欄でOK</span><textarea id="grip" maxlength="12000" placeholder="例：右手で持つと横を向く。持ち手が手に埋まる。大きすぎる。こう握りたい。"></textarea></label>
<button id="clearDecision">採否を未確認に戻す</button></div></div>
<div class="pager"><button id="prev">← 前のアイテム</button><button id="next" class="primary">次のアイテム →</button></div></div>
<details><summary>全体への要望・追加したいアイテム</summary><label for="allNotes" class="sub">種類の分け方や、全アイテムに共通する改善点など</label><textarea id="allNotes" maxlength="20000" placeholder="例：泡・水・タオルを同時に出したい。道具を置く場所を分けたい。"></textarea></details>
</section></main>
<footer>写真：2026-10-08撮影のUnity単体モデル（wash-premium 0.3.0）。持った状態の写真ではありません。ここでの回答は自動でUnityやIssueへ反映されません。</footer>
<script>
'use strict';
const items=/*ITEM_DATA*/;
const KEY='vanimal-wash-item-review-20261010-v1';
const labels={unreviewed:'未確認',keep:'いる',remove:'いらない',hold:'保留'};
const $=id=>document.getElementById(id);
const blank=()=>({version:1,collection:'wash-premium-0.3.0-review',updatedAt:null,overall:'',items:items.map(i=>({id:i.id,name:i.name,decision:'unreviewed',notes:'',grip:''}))});
let state=blank(),current=items[0].id;
function validate(value){
 if(!value||value.version!==1||value.collection!=='wash-premium-0.3.0-review'||!Array.isArray(value.items)||value.items.length!==items.length||typeof value.overall!=='string'||value.overall.length>20000)throw Error('この確認シート用の回答JSONではありません。');
 const clean=blank(),seen=new Set();
 for(const row of value.items){if(!row||!items.some(i=>i.id===row.id)||seen.has(row.id)||!Object.hasOwn(labels,row.decision)||typeof row.notes!=='string'||row.notes.length>12000||typeof row.grip!=='string'||row.grip.length>12000)throw Error('回答の形式が正しくありません。現在の入力は変更していません。');seen.add(row.id);Object.assign(clean.items.find(i=>i.id===row.id),{decision:row.decision,notes:row.notes,grip:row.grip});}
 clean.overall=value.overall;clean.updatedAt=typeof value.updatedAt==='string'?value.updatedAt:null;return clean;
}
function message(text){$('saveStatus').textContent=text;}
try{const stored=localStorage.getItem(KEY);if(stored){state=validate(JSON.parse(stored));message('前回の入力を復元しました。');}else message('まだ回答はありません。');}catch(e){message('ブラウザー保存を利用できないか、前回の回答を読み込めませんでした。JSONで回答を保存してください。');}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));message('ブラウザーに保存済み · '+new Date().toLocaleTimeString('ja-JP'));return true;}catch(e){message('ブラウザーへの保存に失敗しました。「回答を保存」でJSONをダウンロードしてください。');return false;}}
function row(){return state.items.find(i=>i.id===current);}
function filtered(){return items.filter(i=>($('category').value==='all'||i.category===$('category').value)&&($('statusFilter').value==='all'||state.items.find(r=>r.id===i.id).decision===$('statusFilter').value));}
function updateList(){const done=state.items.filter(r=>r.decision!=='unreviewed').length;$('progress').textContent=`採否を記入 ${done} / ${items.length} 点`;$('meter').value=done;$('list').replaceChildren();for(const item of filtered()){const button=document.createElement('button');button.type='button';button.setAttribute('aria-current',String(item.id===current));button.append(document.createTextNode(item.name));const tag=document.createElement('span');tag.textContent=labels[state.items.find(r=>r.id===item.id).decision];button.append(tag);button.onclick=()=>{current=item.id;render();};$('list').append(button);}}
function render(){updateList();const item=items.find(i=>i.id===current);$('empty').hidden=!!item;$('card').hidden=!item;if(!item)return;const r=row();$('name').textContent=item.name;$('categoryLabel').textContent=item.category+(item.image?' / 現行アイテム':' / 追加候補');$('number').textContent=`${items.indexOf(item)+1} / ${items.length}`;$('photo').hidden=!item.image;$('placeholder').hidden=!!item.image;if(item.image){$('photo').src=item.image;$('photo').alt=item.name+'の単体写真';}else{$('photo').removeAttribute('src');$('photo').alt='';}$('caption').textContent=item.image?'現行モデルの単体写真。素材・形状の確認に使えます。':'IMP-DOG-044で登録済み。形状・水面表現はこれから設計します。';document.querySelectorAll('[name=decision]').forEach(e=>e.checked=e.value===r.decision);$('notes').value=r.notes;$('grip').value=r.grip;$('allNotes').value=state.overall;const f=filtered(),index=f.findIndex(i=>i.id===current);$('prev').disabled=index<=0;$('next').disabled=index>=f.length-1&&index!==-1;}
function filterChanged(){const f=filtered();if(!f.some(i=>i.id===current))current=f[0]?.id||null;render();}
function move(direction){const f=filtered();let index=f.findIndex(i=>i.id===current);if(index===-1)index=direction===1?-1:f.length;const item=f[index+direction];if(item){current=item.id;render();}}
document.querySelectorAll('[name=decision]').forEach(e=>e.onchange=()=>{row().decision=e.value;save();updateList();const f=filtered();$('prev').disabled=f.findIndex(i=>i.id===current)<=0;$('next').disabled=f.length===0||(f.findIndex(i=>i.id===current)===f.length-1);});
for(const field of ['notes','grip'])$(field).oninput=()=>{row()[field]=$(field).value;save();};
$('allNotes').value=state.overall;$('allNotes').oninput=()=>{state.overall=$('allNotes').value;save();};
$('clearDecision').onclick=()=>{row().decision='unreviewed';save();render();};$('category').onchange=filterChanged;$('statusFilter').onchange=filterChanged;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
function download(text,type,name){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>{save();download(JSON.stringify(state,null,2),'application/json','vanimal-wash-review-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json');};
$('markdown').onclick=()=>{let text='# VAnimal 洗浄アイテムの回答\n\n';for(const r of state.items)text+=`## ${r.name} [${r.id}]\n\n採否：${labels[r.decision]}\n\n改善点・理由：\n${r.notes||'（未記入）'}\n\n持ったときの違和感：\n${r.grip||'（未記入）'}\n\n`;text+='## 全体への要望\n\n'+(state.overall||'（未記入）')+'\n';download(text,'text/markdown;charset=utf-8','vanimal-wash-review.md');};
$('import').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>1500000)throw Error('回答ファイルが大きすぎます。');const next=validate(JSON.parse(await file.text()));if(!confirm('現在の入力を、読み込む回答で置き換えます。よろしいですか？'))return;state=next;const saved=save();filterChanged();$('allNotes').value=state.overall;if(saved)message('回答を読み込み、ブラウザーに保存しました。');}catch(e){alert('読み込めませんでした。'+e.message);}finally{event.target.value='';}};
render();
</script>
</html>

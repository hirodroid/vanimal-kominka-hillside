<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>秋の周回道 — 景観改善の比較</title>
<style>body{margin:0;background:#f1eee5;color:#292e27;font:16px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:28px}p{max-width:900px}nav{position:sticky;top:0;background:#f1eee5ed;padding:12px 0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{padding:8px;border:1px solid #8b907e;border-radius:6px;background:white;font:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:white;padding:8px;border-radius:8px}img{display:block;width:100%;height:auto}figcaption{font-size:14px;color:#56604e}section{margin:32px 0}h2{font-size:20px}.note{color:#596251;font-size:14px}@media(max-width:760px){.pair{grid-template-columns:1fr}}</style>
<main><p><strong><a href="../2026-10-04-river-verge/index.html">第2段階・川沿いと足元の比較へ</a> · <a href="../2026-10-04-prop-finish/index.html">棚・リード掛け・写真ボード・ボトルの比較へ</a></strong></p><h1>秋の周回道と休憩場所</h1>
<p>道沿いに秋の木立・低木と背の低い草を加え、展望場所の仮ベンチを木製へ更新。奥広場と川辺にも木製ベンチを置きました。道と川面が読める余白を残しています。</p>
<p class="note">2026-10-04 / Unity Editorの固定視点・片眼画像。変更前は今回の追加物を非表示にし、元の仮ベンチを表示した比較です。実機の見え方・FPSの合格を示す資料ではありません。夜は既存の暗さ0.8を模擬しています。</p>
<nav><label>目線 <select id="eye"><option value="adult">通常（1.62m）</option><option value="low">低い目線（0.4m）</option></select></label><label>比較 <select id="mode"><option value="compare">変更前 → 変更後</option><option value="night">変更後の昼 → 夜</option></select></label></nav>
<div id="views"></div><p class="note">カメラ位置・方向・FOV・撮影条件は <a href="capture.json">capture.json</a>。制作と未確認事項は <a href="../../2026-10-04-roadside-scenery.md">制作記録</a>。</p></main>
<script>
const views=[['route-400','古民家へ戻る道'],['route-360','帰り道のカーブ'],['route-280','川沿い'],['route-200','奥広場から川へ'],['route-160','奥広場の入口'],['viewpoint','展望場所の木製ベンチ'],['plaza-rest','奥広場の休憩場所'],['river-rest','川辺の休憩場所'],['farmhouse-view','展望場所から古民家を見返す']];
function render(){const eye=document.querySelector('#eye').value,night=document.querySelector('#mode').value==='night';document.querySelector('#views').innerHTML=views.map(([key,label])=>`<section><h2>${label}</h2><div class="pair">${(night?['after','night']:['before','after']).map(state=>`<figure><img loading="lazy" src="${key}-${eye}-${state}.png" alt="${label} ${state}"><figcaption>${state==='before'?'変更前':state==='night'?'変更後・夜':'変更後・昼'}</figcaption></figure>`).join('')}</div></section>`).join('')};document.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();
</script></html>
